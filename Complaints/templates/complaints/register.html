{% extends 'layout.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-card">
    <h2>Create Account</h2><p class="auth-subtitle">Join Urban Management System</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
        <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" required></div>
        <button type="submit" class="btn auth-btn">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div></div>
{% endblock %}
