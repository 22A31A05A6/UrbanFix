{% extends 'layout.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-card">
    <h2>Welcome Back</h2><p class="auth-subtitle">Login to your account</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
        {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
        <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button type="submit" class="btn auth-btn">Login</button>
    </form>
    <p class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</div></div>
{% endblock %}
